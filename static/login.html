<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login &bull; Privacy RAG</title>
  <meta name="description" content="Secure unified sign in and registration portal for Privacy RAG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #0f141c;
      --bg-surface: #161d27;
      --bg-surface-hover: #1c2532;
      --bg-inset: #0b0f16;
      --border-color: #232d3d;
      --border-focus: #3b82f6;
      --text-primary: #e2e8f0;
      --text-secondary: #8a99ad;
      --text-muted: #5a687c;
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-card: 0 20px 40px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 40%);
    }

    /* CARD CONTAINER */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    /* BRAND / HEADER */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* TWO TABS: LOGIN & SIGN UP */
    .tab-switch {
      display: flex;
      background: var(--bg-inset);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 24px;
      gap: 3px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--color-primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.4);
    }

    /* FORMS */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: var(--bg-inset);
      border: 1px solid var(--border-color);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    /* OTP CODE INPUT (6-Digit) */
    .otp-input-wrap {
      margin: 20px 0;
      text-align: center;
    }

    .otp-code-input {
      width: 100%;
      background: var(--bg-inset);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 12px;
      text-align: center;
      color: #60a5fa;
      outline: none;
      transition: all 0.2s ease;
    }

    .otp-code-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.25);
      background: #0e141f;
    }

    /* BUTTONS */
    .btn-submit {
      width: 100%;
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.05s ease;
      margin-top: 10px;
      font-family: inherit;
    }

    .btn-submit:hover {
      background: var(--color-primary-hover);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* ERROR & ALERT BOXES */
    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      line-height: 1.45;
      margin-bottom: 18px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .alert-info {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
    }

    .user-pill {
      display: inline-block;
      font-family: var(--font-mono);
      background: var(--bg-inset);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 4px;
      color: #93c5fd;
      font-size: 0.8rem;
    }

    .card-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .card-footer a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- BRAND / LOGO -->
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="brand-title" id="page-title">Privacy RAG</h1>
      <p class="brand-subtitle" id="page-subtitle">Unified Authentication &bull; Self-Hosted Access</p>
    </div>

    <!-- ERROR / ALERT BANNER -->
    <div id="alert-box" class="alert-box"></div>

    <!-- TWO TABS: LOGIN & SIGN UP -->
    <div class="tab-switch" id="tab-nav">
      <button type="button" class="tab-btn active" id="tab-login-btn" onclick="selectTab('login')">Login</button>
      <button type="button" class="tab-btn" id="tab-signup-btn" onclick="selectTab('signup')">Sign Up</button>
    </div>

    <!-- ========================================== -->
    <!-- TAB 1: LOGIN                               -->
    <!-- ========================================== -->
    <div id="view-login">
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="user@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="btn-login-submit" class="btn-submit">
          <span class="spinner" id="spinner-login"></span>
          <span id="text-login">Sign In</span>
        </button>
      </form>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: SIGN UP                             -->
    <!-- ========================================== -->
    <div id="view-signup" style="display: none;">
      <!-- Step 1: Full Name, Email, Claimed Organization & Password -->
      <form id="form-signup">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Alice Smith" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="form-input" placeholder="alice@company.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-org">Claimed Organization</label>
          <input type="text" id="signup-org" class="form-input" placeholder="e.g. psg" required autocomplete="organization" />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password" />
        </div>

        <button type="submit" id="btn-signup-submit" class="btn-submit">
          <span class="spinner" id="spinner-signup"></span>
          <span id="text-signup">Sign Up &amp; Send Code</span>
        </button>
      </form>

      <!-- Step 2: Enter OTP (swapped in on signup success) -->
      <div id="signup-otp-panel" style="display: none; text-align: center; margin-top: 12px;">
        <p style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 12px;">
          Enter the 6-digit verification code sent to:<br />
          <span class="user-pill" id="otp-target-email">user@company.com</span>
        </p>

        <form id="form-otp">
          <div class="otp-input-wrap">
            <input type="text" id="signup-otp-input" class="otp-code-input" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="------" required autocomplete="one-time-code" />
          </div>

          <button type="submit" id="btn-otp-submit" class="btn-submit">
            <span class="spinner" id="spinner-otp"></span>
            <span id="text-otp">Verify OTP</span>
          </button>

          <button type="button" class="btn-secondary" onclick="backToSignupForm()">
            <span>Change Email</span>
          </button>
        </form>
      </div>
    </div>

    <!-- CARD FOOTER -->
    <div class="card-footer">
      <span>Admin accounts can also log in directly using the form above.</span>
    </div>
  </div>

  <script>
    let activeTab = 'login';
    let currentSignupEmail = '';

    const alertBox = document.getElementById('alert-box');
    const tabNav = document.getElementById('tab-nav');
    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabSignupBtn = document.getElementById('tab-signup-btn');
    const viewLogin = document.getElementById('view-login');
    const viewSignup = document.getElementById('view-signup');
    const formSignup = document.getElementById('form-signup');
    const signupOtpPanel = document.getElementById('signup-otp-panel');

    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const signupEmailInput = document.getElementById('signup-email');
    const signupPasswordInput = document.getElementById('signup-password');
    const signupOtpInput = document.getElementById('signup-otp-input');
    const otpTargetEmail = document.getElementById('otp-target-email');

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    function selectTab(tab) {
      hideAlert();
      activeTab = tab;
      if (tab === 'login') {
        tabLoginBtn.classList.add('active');
        tabSignupBtn.classList.remove('active');
        viewLogin.style.display = 'block';
        viewSignup.style.display = 'none';
        setTimeout(() => loginEmailInput.focus(), 50);
      } else {
        tabSignupBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
        viewSignup.style.display = 'block';
        viewLogin.style.display = 'none';
        backToSignupForm();
        setTimeout(() => signupEmailInput.focus(), 50);
      }
    }

    function backToSignupForm() {
      formSignup.style.display = 'block';
      signupOtpPanel.style.display = 'none';
      tabNav.style.display = 'flex';
    }

    // Toggle Button Loading State
    function setBtnLoading(btnId, spinnerId, textId, loadingText) {
      const btn = document.getElementById(btnId);
      const spinner = document.getElementById(spinnerId);
      const text = document.getElementById(textId);
      if (btn) btn.disabled = true;
      if (spinner) spinner.style.display = 'inline-block';
      if (text) {
        text.dataset.orig = text.textContent;
        text.textContent = loadingText;
      }
    }

    function resetBtnLoading(btnId, spinnerId, textId) {
      const btn = document.getElementById(btnId);
      const spinner = document.getElementById(spinnerId);
      const text = document.getElementById(textId);
      if (btn) btn.disabled = false;
      if (spinner) spinner.style.display = 'none';
      if (text && text.dataset.orig) text.textContent = text.dataset.orig;
    }

    // ========================================================
    // SIGN UP FLOW
    // 1. User enters Email and Password. Calls /api/v1/auth/register.
    // 2. UI swaps to an "Enter OTP" input. Calls /api/v1/auth/verify-otp.
    // 3. On OTP success, automatically redirect to /pending.
    // ========================================================
    formSignup.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const fullNameInput = document.getElementById('signup-name');
      const orgInput = document.getElementById('signup-org');

      const full_name = fullNameInput ? fullNameInput.value.trim() : '';
      const email = signupEmailInput.value.trim().toLowerCase();
      const org_id = orgInput ? orgInput.value.trim() : 'default_org';
      const password = signupPasswordInput.value;

      setBtnLoading('btn-signup-submit', 'spinner-signup', 'text-signup', 'Sending Code...');

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, full_name, org_id })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Registration failed.');
        }

        currentSignupEmail = email;
        localStorage.setItem('pending_email', email);
        localStorage.setItem('rag_pending_email', email);

        // Step 2: UI swaps to Enter OTP input
        formSignup.style.display = 'none';
        signupOtpPanel.style.display = 'block';
        otpTargetEmail.textContent = email;
        signupOtpInput.value = '';
        setTimeout(() => signupOtpInput.focus(), 50);

        showAlert(data.message || 'Verification code sent to email. Please enter the 6-digit code below.', 'info');
      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        resetBtnLoading('btn-signup-submit', 'spinner-signup', 'text-signup');
      }
    });

    // Verify OTP form submission
    document.getElementById('form-otp').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const otp = signupOtpInput.value.trim();
      if (!otp || otp.length !== 6) {
        showAlert('Please enter the complete 6-digit verification code.', 'error');
        return;
      }

      setBtnLoading('btn-otp-submit', 'spinner-otp', 'text-otp', 'Verifying...');

      try {
        const res = await fetch('/api/v1/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentSignupEmail, otp: otp })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Invalid verification code.');
        }

        // Step 3: On OTP success, the UI automatically redirects the browser to the /pending page!
        showAlert('Email verified successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/pending';
        }, 500);

      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        resetBtnLoading('btn-otp-submit', 'spinner-otp', 'text-otp');
      }
    });

    // Auto-advance OTP input digits
    signupOtpInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // ========================================================
    // LOGIN FLOW & SESSION MANAGEMENT
    // 1. User enters Email and Password. Calls /api/v1/auth/login.
    // 2. If response is 403 PENDING_APPROVAL:
    //    Show message: "Email verified. Please wait for Admin approval."
    //    Do not store token or redirect.
    // 3. If response is 200 OK:
    //    Store user object (username, role, org_id, status) in localStorage as rag_session.
    // 4. Redirect Logic:
    //    - If role == 'admin', redirect to /admin.
    //    - If role == 'member', redirect to /dashboard.
    // ========================================================
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = loginEmailInput.value.trim().toLowerCase();
      const password = loginPasswordInput.value;

      setBtnLoading('btn-login-submit', 'spinner-login', 'text-login', 'Authenticating...');

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        // Check for 403 / Pending Approval response
        if (res.status === 403) {
          const detail = data.detail || {};
          const code = typeof detail === 'object' ? (detail.code || '') : (typeof detail === 'string' ? detail : '');
          const msg = typeof detail === 'object' ? (detail.message || '') : (typeof detail === 'string' ? detail : '');

          if (code === 'PENDING_APPROVAL' || msg === 'PENDING_APPROVAL' || msg.toLowerCase().includes('pending') || res.status === 403) {
            localStorage.setItem('pending_email', email);
            localStorage.setItem('rag_pending_email', email);
            // Ensure no token or session is stored
            localStorage.removeItem('token');
            localStorage.removeItem('rag_user_token');
            localStorage.removeItem('rag_session');
            localStorage.removeItem('rag_verifier_session');
            // Exact required error message:
            showAlert('Email verified. Please wait for Admin approval.', 'error');
            return;
          }
        }

        if (!res.ok) {
          const errMsg = typeof data.detail === 'string' ? data.detail : (data.detail?.message || data.message || 'Invalid email or password.');
          throw new Error(errMsg);
        }

        // 200 OK:
        // Store entire user object (username, role, org_id) in localStorage as rag_session
        const userObj = {
          user_id: data.user_id || data.user?.user_id || usr_,
          username: data.username || data.user?.username || (email.split('@')[0]),
          email: data.email || data.user?.email || email,
          full_name: data.user?.full_name || data.full_name || '',
          role: (data.role || data.user?.role || 'member').toLowerCase(),
          org_id: data.org_id || data.user?.org_id || 'default_org',
          status: data.status || data.user?.status || 'approved'
        };
        localStorage.setItem('rag_session', JSON.stringify(userObj));

        // Save token and backward-compatibility keys
        const token = data.token;
        if (token) {
          localStorage.setItem('token', token);
          localStorage.setItem('rag_user_token', token);
        }
        if (data.user) {
          localStorage.setItem('rag_verifier_session', JSON.stringify({ ...data.user, ...userObj }));
        }

        // Redirect logic:
        if (userObj.role === 'admin') {
          if (token) localStorage.setItem('rag_admin_token', token);
          if (email) localStorage.setItem('rag_admin_email', email);
          showAlert('Administrator authenticated! Redirecting to Admin Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 300);
        } else {
          showAlert('Login successful! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 300);
        }

      } catch (err) {
        showAlert(err.message, 'error');
      } finally {
        resetBtnLoading('btn-login-submit', 'spinner-login', 'text-login');
      }
    });

    // Check query params on load (e.g. ?mode=signup or ?email=...)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      if (email) {
        loginEmailInput.value = email;
        signupEmailInput.value = email;
      }
      if (params.get('mode') === 'signup') {
        selectTab('signup');
      } else {
        selectTab('login');
      }
    });
  </script>
</body>
</html>
